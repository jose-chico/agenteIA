<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PIX - Falcon</title>
    <style>
        :root {
            --bg: #0a0e27;
            --card: #111736;
            --text: #e8ecff;
            --accent: #00ff88;
            --accent-dark: #00cc6f;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: radial-gradient(circle at 20% 10%, #1a2352, var(--bg));
            color: var(--text);
            font-family: Arial, sans-serif;
        }

        .card {
            width: 100%;
            max-width: 420px;
            background: var(--card);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 18px;
            padding: 20px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
        }

        .qr-wrap {
            display: flex;
            justify-content: center;
            background: #fff;
            border-radius: 14px;
            padding: 14px;
            margin: 0 0 12px;
        }

        .qr-wrap img {
            width: 250px;
            height: 250px;
            object-fit: contain;
        }

        button {
            width: 100%;
            border: none;
            border-radius: 10px;
            padding: 12px 14px;
            background: var(--accent);
            color: #052b18;
            font-weight: 700;
            cursor: pointer;
            text-align: center;
        }

        button:hover { background: var(--accent-dark); }
        button:disabled { opacity: 0.7; cursor: not-allowed; }
    </style>
</head>
<body>
    <div class="card">
        <div class="qr-wrap">
            <img id="pix-qr" alt="QR Code PIX">
        </div>
        <button id="copy-code-btn">Copiar PIX</button>
    </div>

    <script>
        const pixQr = document.getElementById("pix-qr");
        const copyCodeBtn = document.getElementById("copy-code-btn");
        let pixPayload = "";

        function emvField(id, value) {
            const size = String(value.length).padStart(2, "0");
            return `${id}${size}${value}`;
        }

        function crc16(str) {
            let crc = 0xFFFF;
            for (let i = 0; i < str.length; i++) {
                crc ^= str.charCodeAt(i) << 8;
                for (let j = 0; j < 8; j++) {
                    crc = (crc & 0x8000) ? (crc << 1) ^ 0x1021 : (crc << 1);
                    crc &= 0xFFFF;
                }
            }
            return crc.toString(16).toUpperCase().padStart(4, "0");
        }

        function sanitizeName(name) {
            return (name || "FALCON AI")
                .toUpperCase()
                .normalize("NFD")
                .replace(/[\u0300-\u036f]/g, "")
                .replace(/[^A-Z0-9 ]/g, "")
                .slice(0, 25)
                .trim() || "FALCON AI";
        }

        function sanitizeCity(city) {
            return (city || "SAO PAULO")
                .toUpperCase()
                .normalize("NFD")
                .replace(/[\u0300-\u036f]/g, "")
                .replace(/[^A-Z0-9 ]/g, "")
                .slice(0, 15)
                .trim() || "SAO PAULO";
        }

        function buildPixPayload(key, receiverName, city, amount) {
            const gui = emvField("00", "br.gov.bcb.pix");
            const pixKey = emvField("01", key);
            const merchantAccount = emvField("26", gui + pixKey);
            const merchantCategory = emvField("52", "0000");
            const currency = emvField("53", "986");
            const amountField = emvField("54", Number(amount || 1).toFixed(2));
            const country = emvField("58", "BR");
            const nameField = emvField("59", sanitizeName(receiverName));
            const cityField = emvField("60", sanitizeCity(city));
            const txidField = emvField("62", emvField("05", "***"));

            const base = "000201" +
                merchantAccount +
                merchantCategory +
                currency +
                amountField +
                country +
                nameField +
                cityField +
                txidField +
                "6304";

            return base + crc16(base);
        }

        async function copyToClipboard(text) {
            if (!text) return;
            const previous = copyCodeBtn.textContent;
            try {
                await navigator.clipboard.writeText(text);
                copyCodeBtn.textContent = "PIX copiado";
                setTimeout(() => {
                    copyCodeBtn.textContent = previous;
                }, 1600);
            } catch {
                copyCodeBtn.textContent = "Nao foi possivel copiar";
            }
        }

        async function init() {
            try {
                const response = await fetch("/payments/pix-info");
                const data = await response.json();

                const pixKey = String(data.pixKey || "").trim();
                const receiverName = String(data.receiverName || "FALCON AI");
                const city = String(data.city || "SAO PAULO");
                const amount = Number(data.amount || 1);

                if (!pixKey) {
                    throw new Error("PIX key nao configurada.");
                }

                pixPayload = buildPixPayload(pixKey, receiverName, city, amount);
                const qrUrl = "https://quickchart.io/qr?size=320&text=" + encodeURIComponent(pixPayload);
                pixQr.src = qrUrl;

                copyCodeBtn.onclick = () => copyToClipboard(pixPayload);
            } catch {
                copyCodeBtn.disabled = true;
                copyCodeBtn.textContent = "Erro ao gerar PIX";
            }
        }

        init();
    </script>
</body>
</html>
