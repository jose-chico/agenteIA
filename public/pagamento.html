<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagamento PIX - Falcon</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body { background: var(--bg-primary); color: var(--text-primary); }
        .pay-container { max-width: 520px; margin: 40px auto; background: var(--bg-secondary); padding: 24px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.4); }
        .pay-container h1 { margin-bottom: 8px; }
        .pay-container p { color: var(--text-secondary); margin-bottom: 12px; }
        .pix-box { display: flex; flex-direction: column; align-items: center; gap: 14px; margin-top: 12px; }
        .pix-key { width: 100%; background: #0f172a; border: 1px solid var(--border-color); border-radius: 8px; padding: 12px; word-break: break-all; }
        .actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
        .btn-copy, .btn-back { padding: 10px 14px; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; }
        .btn-copy { background: var(--accent-color); color: #fff; }
        .btn-back { background: #334155; color: #e5e7eb; }
        .qr { background: #fff; padding: 12px; border-radius: 12px; }
        .note { font-size: 0.9rem; color: var(--text-secondary); text-align: center; }
    </style>
</head>
<body class="client-body">
    <div id="chat-app" style="max-width:560px; height:auto;">
        <div class="pay-container">
            <h1>Pagamento PIX</h1>
            <p>Valor: <strong>R$ 0,20</strong></p>
            <p>Chave PIX (PicPay): <strong>franciscoclassname@gmail.com</strong></p>
            <div class="pix-box">
                <div class="qr">
                    <img id="pix-qr" src="" alt="QR Code PIX" width="240" height="240" />
                </div>
                <div class="pix-key" id="pix-key">franciscoclassname@gmail.com</div>
                <div class="actions">
                    <button class="btn-copy" id="copy-key">Copiar chave</button>
                    <button class="btn-back" onclick="window.location.href='index.html'">Voltar ao chat</button>
                </div>
                <p class="note">Após pagar, envie o comprovante. Quando for aprovado, clique em "Verificar autorização" no chat.</p>
            </div>
        </div>
    </div>

    <script>
        // Monta payload EMV Pix simples e gera QR via serviço de QR
        (function() {
            const key = "franciscoclassname@gmail.com";
            const amount = 0.20;
            const merchant = "FALCON AI";
            const city = "SAOPAULO";
            const txid = "FALCONCHAT";

            function emv(id, value) {
                const len = String(value).length.toString().padStart(2, "0");
                return `${id}${len}${value}`;
            }

            function crc16(str) {
                let crc = 0xFFFF;
                for (let c = 0; c < str.length; c++) {
                    crc ^= str.charCodeAt(c) << 8;
                    for (let i = 0; i < 8; i++) {
                        crc = (crc & 0x8000) ? (crc << 1) ^ 0x1021 : (crc << 1);
                        crc &= 0xFFFF;
                    }
                }
                return crc.toString(16).toUpperCase().padStart(4, "0");
            }

            // Guideline BR Code
            const gui = emv("00", "BR.GOV.BCB.PIX");
            const keyField = emv("01", key);
            const desc = ""; // opcional
            const merchantAccount = emv("26", gui + keyField + (desc ? emv("02", desc) : ""));

            const merchantCat = emv("52", "0000");
            const currency = emv("53", "986");
            const amt = emv("54", amount.toFixed(2));
            const country = emv("58", "BR");
            const cityField = emv("60", city);
            const nameField = emv("59", merchant);
            const addData = emv("62", emv("05", txid));

            let payload = emv("00", "01") + emv("01", "12") + merchantAccount + merchantCat + currency + amt + country + nameField + cityField + addData + "6304";
            const checksum = crc16(payload);
            payload += checksum;

            const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=${encodeURIComponent(payload)}`;
            document.getElementById("pix-qr").src = qrUrl;

            const copyBtn = document.getElementById("copy-key");
            copyBtn.onclick = async () => {
                try {
                    await navigator.clipboard.writeText(key);
                    copyBtn.textContent = "Chave copiada";
                    setTimeout(() => copyBtn.textContent = "Copiar chave", 2000);
                } catch (e) {
                    copyBtn.textContent = "Copie manualmente";
                }
            };
        })();
    </script>
</body>
</html>
